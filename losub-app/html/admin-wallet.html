<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wallet Oversight — Losub Admin</title>
<link rel="stylesheet" href="../css/base.css" />
<link rel="stylesheet" href="../css/shared.css" />
<link rel="stylesheet" href="../css/app-shell.css" />
<link rel="stylesheet" href="../css/admin-shell.css" />
<link rel="stylesheet" href="../css/admin-common.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="app-shell-page">
  <div class="app-shell admin-shell">
    <div id="adminSidebar"></div>

    <div class="app-shell__main">
      <header class="topbar">
        <button class="topbar__menu-btn" id="topbarMenuBtn" aria-label="Open menu">☰</button>
        <h1 class="topbar__title">Wallet oversight</h1>
        <button class="topbar__bell" aria-label="Alerts">🔔</button>
      </header>

      <main class="page-content">
        <section class="page__header">
          <h2>Platform-wide wallet activity</h2>
          <p>Total funding, spending, and balances held across all users.</p>
        </section>

        <section class="admin-stat-grid">
          <article class="admin-stat-card">
            <span class="admin-stat-card__label">Total funded (all-time)</span>
            <span class="admin-stat-card__value" id="statTotalFunded">—</span>
          </article>
          <article class="admin-stat-card">
            <span class="admin-stat-card__label">Total spent</span>
            <span class="admin-stat-card__value" id="statTotalSpent">—</span>
          </article>
          <article class="admin-stat-card">
            <span class="admin-stat-card__label">Held in wallets</span>
            <span class="admin-stat-card__value" id="statHeldBalance">—</span>
          </article>
        </section>

        <div class="admin-search" style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
          <input type="search" id="txSearch" placeholder="Search by user or description…" style="flex:1;" />
          <button type="button" class="admin-action-btn" id="downloadAdminPdf">Download PDF</button>
        </div>

        <section class="panel">
          <table class="admin-table">
            <thead><tr><th>Date</th><th>User</th><th>Type</th><th>Description</th><th>Amount</th></tr></thead>
            <tbody id="adminTxTableBody"></tbody>
          </table>
          <p class="empty-state" id="adminTxEmpty" hidden>No transactions match your search.</p>
        </section>
      </main>
    </div>
  </div>

<script src="../js/app-shell.js"></script>
<script src="../js/admin-nav.js"></script>
<script src="../js/admin-wallet.js"></script>
<script src="../js/load-admin-sidebar.js"></script>
</body>
</html>
