<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Users — Losub Admin</title>
<link rel="stylesheet" href="../css/base.css" />
<link rel="stylesheet" href="../css/shared.css" />
<link rel="stylesheet" href="../css/app-shell.css" />
<link rel="stylesheet" href="../css/admin-shell.css" />
<link rel="stylesheet" href="../css/admin-common.css" />
</head>
<body class="app-shell-page">
  <div class="app-shell admin-shell">
  
    <div id="adminSidebar"></div>

    <div class="app-shell__main">
      <header class="topbar">
        <button class="topbar__menu-btn" id="topbarMenuBtn" aria-label="Open menu">☰</button>
        <h1 class="topbar__title">Users</h1>
        <button class="topbar__bell" aria-label="Alerts">🔔</button>
      </header>

      <main class="page-content">
        <section class="page__header">
          <h2>All users</h2>
          <p>Every account on Losub.</p>
        </section>

        <div class="admin-search">
          <input type="search" id="userSearch" placeholder="Search by name or email…" />
        </div>

        <div class="tab-bar" id="userRoleTabs">
          <button type="button" class="tab-bar__btn is-active" data-role="all">All</button>
          <button type="button" class="tab-bar__btn" data-role="member">Members</button>
          <button type="button" class="tab-bar__btn" data-role="admin">Admins</button>
          <button type="button" class="tab-bar__btn" data-role="owner">Owners</button>
        </div>

        <section class="panel">
          <table class="admin-table">
            <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th><th>Status</th><th></th></tr></thead>
            <tbody id="usersTableBody"></tbody>
          </table>
          <p class="empty-state" id="usersEmpty" hidden>No users match your search.</p>
        </section>
      </main>
    </div>
  </div>

  <div class="modal-overlay" id="userModalOverlay" hidden>
    <div class="modal">
      <button type="button" class="modal__close" id="userModalClose" aria-label="Close">&times;</button>
      <h2 id="userModalTitle">Suspend user</h2>
      <p class="modal__sub" id="userModalSub">This will prevent them from logging in until reinstated.</p>
      <div class="modal__actions">
        <button type="button" class="admin-action-btn admin-action-btn--danger" id="userModalConfirm">Confirm</button>
        <button type="button" class="admin-action-btn" id="userModalCancel">Cancel</button>
      </div>
    </div>
  </div>

<script src="../js/app-shell.js"></script>
<script src="../js/admin-users.js"></script>
<script src="../js/load-admin-sidebar.js"></script>
</body>
</html>
