<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Groups & Plans — Losub Admin</title>
<link rel="stylesheet" href="../css/base.css" />
<link rel="stylesheet" href="../css/shared.css" />
<link rel="stylesheet" href="../css/app-shell.css" />
<link rel="stylesheet" href="../css/admin-shell.css" />
<link rel="stylesheet" href="../css/admin-common.css" />
</head>
<body class="app-shell-page">
  <div class="app-shell admin-shell">
    <div id="adminSidebar"></div>

    <div class="app-shell__main">
      <header class="topbar">
        <button class="topbar__menu-btn" id="topbarMenuBtn" aria-label="Open menu">☰</button>
        <h1 class="topbar__title">Groups & plans</h1>
        <button class="topbar__bell" aria-label="Alerts">🔔</button>
      </header>

      <main class="page-content">
        <section class="page__header">
          <h2>All groups</h2>
          <p>Every active plan group on the platform.</p>
        </section>

        <div class="admin-search">
          <input type="search" id="groupSearch" placeholder="Search by plan or manager…" />
        </div>

        <div class="tab-bar" id="groupStatusTabs">
          <button type="button" class="tab-bar__btn is-active" data-status="all">All</button>
          <button type="button" class="tab-bar__btn" data-status="active">Active</button>
          <button type="button" class="tab-bar__btn" data-status="full">Full</button>
          <button type="button" class="tab-bar__btn" data-status="exit_requested">Exit requested</button>
        </div>

        <section class="panel">
          <table class="admin-table">
            <thead><tr><th>Plan</th><th>Manager</th><th>Seats</th><th>Monthly revenue</th><th>Status</th><th></th></tr></thead>
            <tbody id="groupsTableBody"></tbody>
          </table>
          <p class="empty-state" id="groupsEmpty" hidden>No groups match your search.</p>
        </section>
      </main>
    </div>
  </div>

  <!-- ============ DELETE GROUP MODAL ============ -->
  <div class="modal-overlay" id="deleteGroupOverlay" hidden>
    <div class="modal">
      <button type="button" class="modal__close" id="deleteGroupClose" aria-label="Close">&times;</button>
      <h2>Close this group?</h2>
      <p class="modal__sub" id="deleteGroupSub">This removes every member's seat and permanently deletes the group. This can't be undone.</p>
      <div class="modal__actions">
        <button type="button" class="auth-submit auth-submit--danger" id="confirmDeleteGroup">Close group</button>
        <button type="button" class="link-btn" id="cancelDeleteGroup">Cancel</button>
      </div>
    </div>
  </div>

<script src="../js/app-shell.js"></script>
<script src="../js/admin-groups.js"></script>
<script src="../js/load-admin-sidebar.js"></script>
</body>
</html>
