<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Messaging — Losub Admin</title>
<link rel="stylesheet" href="../css/base.css" />
<link rel="stylesheet" href="../css/shared.css" />
<link rel="stylesheet" href="../css/app-shell.css" />
<link rel="stylesheet" href="../css/admin-shell.css" />
<link rel="stylesheet" href="../css/admin-common.css" />
<link rel="stylesheet" href="../css/admin-messaging.css" />
</head>
<body class="app-shell-page">
  <div class="app-shell admin-shell">
    <div id="adminSidebar"></div>

    <div class="app-shell__main">
      <header class="topbar">
        <button class="topbar__menu-btn" id="topbarMenuBtn" aria-label="Open menu">☰</button>
        <h1 class="topbar__title">Messaging</h1>
        <button class="topbar__bell" aria-label="Alerts">🔔</button>
      </header>

      <main class="page-content">
        <section class="page__header">
          <h2>Manager messaging</h2>
          <p>Direct threads with group managers for check-ins and disputes. Messages disappear 24 hours after they're sent.</p>
        </section>

        <div class="messaging-layout">
          <aside class="thread-list panel" id="threadList"></aside>
          <section class="thread-panel panel" id="threadPanel">
            <p class="empty-state">Select a manager to view the conversation.</p>
          </section>
        </div>
      </main>
    </div>
  </div>

<script src="../js/app-shell.js"></script>
<script src="../js/admin-messaging.js"></script>
<script src="../js/load-admin-sidebar.js"></script>
</body>
</html>
