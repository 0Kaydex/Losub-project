<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reassignment — Losub Admin</title>
<link rel="stylesheet" href="../css/base.css" />
<link rel="stylesheet" href="../css/shared.css" />
<link rel="stylesheet" href="../css/app-shell.css" />
<link rel="stylesheet" href="../css/admin-shell.css" />
<link rel="stylesheet" href="../css/admin-common.css" />
</head>
<body class="app-shell-page">
  <div class="app-shell admin-shell">
    <div id="adminSidebar"></div>

    <div class="app-shell__main">
      <header class="topbar">
        <button class="topbar__menu-btn" id="topbarMenuBtn" aria-label="Open menu">☰</button>
        <h1 class="topbar__title">Reassignment</h1>
        <button class="topbar__bell" aria-label="Alerts">🔔</button>
      </header>

      <main class="page-content">
        <div style="background:#FEF3C7; border:1px solid #F59E0B; color:#92400E; padding:12px 16px; border-radius:8px; margin-bottom:16px; font-size:14px;">⚠️ <strong>Preview only.</strong> This page shows placeholder data and is not yet connected to the backend. Nothing here is saved.</div>

        <section class="page__header">
          <h2>Reassignment queue</h2>
          <p>Managers flagged inactive, past their response deadline.</p>
        </section>

        <div id="reassignmentList"></div>
        <p class="empty-state" id="reassignmentEmpty" hidden>No pending reassignments right now.</p>
      </main>
    </div>
  </div>

  <div class="modal-overlay" id="reassignModalOverlay" hidden>
    <div class="modal">
      <button type="button" class="modal__close" id="reassignModalClose" aria-label="Close">&times;</button>
      <h2>Confirm reassignment</h2>
      <p class="modal__sub" id="reassignModalSub"></p>
      <div class="modal__actions">
        <button type="button" class="admin-action-btn admin-action-btn--primary" id="reassignModalConfirm">Reassign now</button>
        <button type="button" class="admin-action-btn" id="reassignModalCancel">Cancel</button>
      </div>
    </div>
  </div>

<script src="../js/app-shell.js"></script>
<script src="../js/admin-reassignment.js"></script>
<script src="../js/load-admin-sidebar.js"></script>
</body>
</html>
