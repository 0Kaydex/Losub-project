<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Audit Log — Losub Admin</title>
<link rel="stylesheet" href="../css/base.css" />
<link rel="stylesheet" href="../css/shared.css" />
<link rel="stylesheet" href="../css/app-shell.css" />
<link rel="stylesheet" href="../css/admin-shell.css" />
<link rel="stylesheet" href="../css/admin-common.css" />
</head>
<body class="app-shell-page">
  <div class="app-shell admin-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__top">
        <a href="admin-dashboard.html" class="sidebar__logo">Losub <span class="admin-badge">Admin</span></a>
        <button class="sidebar__collapse-btn" id="sidebarCollapseBtn" aria-label="Collapse sidebar">⟨⟩</button>
      </div>
      <nav class="sidebar__nav">
        <a href="admin-dashboard.html" class="sidebar__link" data-page="admin-dashboard"><span class="sidebar__icon">🏠</span><span class="sidebar__label">Dashboard</span></a>
        <a href="admin-users.html" class="sidebar__link" data-page="admin-users"><span class="sidebar__icon">👥</span><span class="sidebar__label">Users</span></a>
        <a href="admin-groups.html" class="sidebar__link" data-page="admin-groups"><span class="sidebar__icon">📦</span><span class="sidebar__label">Groups & plans</span></a>
        <a href="admin-verification.html" class="sidebar__link" data-page="admin-verification"><span class="sidebar__icon">✅</span><span class="sidebar__label">Verification</span></a>
        <a href="admin-messaging.html" class="sidebar__link" data-page="admin-messaging"><span class="sidebar__icon">💬</span><span class="sidebar__label">Messaging</span></a>
        <a href="admin-reassignment.html" class="sidebar__link" data-page="admin-reassignment"><span class="sidebar__icon">🔁</span><span class="sidebar__label">Reassignment</span></a>
        <a href="admin-audit.html" class="sidebar__link" data-page="admin-audit"><span class="sidebar__icon">📜</span><span class="sidebar__label">Audit log</span></a>
        <a href="admin-wallet.html" class="sidebar__link" data-page="admin-wallet"><span class="sidebar__icon">💰</span><span class="sidebar__label">Wallet oversight</span></a>
      </nav>
      <a href="#" class="sidebar__user" id="adminLogout"><span class="sidebar__avatar">A</span><span class="sidebar__label">Log out</span></a>
    </aside>

    <div class="app-shell__backdrop" id="shellBackdrop"></div>

    <div class="app-shell__main">
      <header class="topbar">
        <button class="topbar__menu-btn" id="topbarMenuBtn" aria-label="Open menu">☰</button>
        <h1 class="topbar__title">Audit log</h1>
        <button class="topbar__bell" aria-label="Alerts">🔔</button>
      </header>

      <main class="page-content">
        <section class="page__header">
          <h2>Admin action log</h2>
          <p>Every action taken by admin staff, for dispute records.</p>
        </section>

        <div class="tab-bar" id="auditTypeTabs">
          <button type="button" class="tab-bar__btn is-active" data-type="all">All</button>
          <button type="button" class="tab-bar__btn" data-type="verification">Verification</button>
          <button type="button" class="tab-bar__btn" data-type="reassignment">Reassignment</button>
          <button type="button" class="tab-bar__btn" data-type="user">User actions</button>
        </div>

        <section class="panel">
          <table class="admin-table">
            <thead><tr><th>Timestamp</th><th>Admin</th><th>Action</th><th>Target</th></tr></thead>
            <tbody id="auditTableBody"></tbody>
          </table>
          <p class="empty-state" id="auditEmpty" hidden>No actions in this filter.</p>
        </section>
      </main>
    </div>
  </div>

<script src="../js/app-shell.js"></script>
<script src="../js/admin-nav.js"></script>
<script src="../js/admin-audit.js"></script>
</body>
</html>
